[[tasks]]
name = "main"
interval = 25000

[[tasks.programs]]
name = "BlindLogic"
type = "Lua"
script = '''
local blind

-- called once before cyclic execution
function Init(gv) blind = Blind:new(BlindConfigFromMillis(500, 50000, 50000)) end

-- called every cycle
function Cycle(gv, now)
	gv.outputs.blind_up, gv.outputs.blind_down =
		blind:execute(now, gv.inputs.button_up, gv.inputs.button_down)
end
'''

[[tasks.io]]
type = "i2c"
bus = "/dev/i2c-1"

[tasks.io.components."0x3b"]
type = "pcf8574"
direction = "input"
inputs = { 0 = "button_up", 1 = "button_down" }

[tasks.io.components."0x20"]
type = "max7311"
direction = "output"
outputs = { 0 = "blind_up", 1 = "blind_down" }
